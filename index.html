<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hex Code Finder</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:#121212;
      color:#f5f5f5;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      margin:0;
    }

    .picker-wrapper {
      background:#1e1e1e;
      padding:20px 24px;
      border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
      display:flex;
      flex-direction:column;
      gap:14px;
      max-width:320px;
      width:100%;
    }

    .picker-header {
      font-size:18px;
      font-weight:600;
    }

    .picker-row {
      display:flex;
      align-items:center;
      gap:10px;
    }

    input[type="color"] {
      appearance:none;
      -webkit-appearance:none;
      border:none;
      padding:0;
      width:50px;
      height:32px;
      border-radius:6px;
      cursor:pointer;
      background:none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding:0;
      border-radius:6px;
    }

    input[type="color"]::-webkit-color-swatch {
      border:none;
      border-radius:6px;
    }

    input[type="color"]::-moz-color-swatch {
      border:none;
      border-radius:6px;
    }

    .hex-display-row {
      display:flex;
      gap:8px;
      align-items:center;
    }

    .hex-label {
      font-size:14px;
      opacity:0.8;
    }

    .hex-input {
      flex:1;
      padding:6px 8px;
      border-radius:6px;
      border:1px solid #333;
      background:#111;
      color:#f5f5f5;
      font-family:monospace;
      font-size:14px;
    }

    .copy-btn {
      padding:6px 10px;
      border-radius:6px;
      border:none;
      background:#3b82f6;
      color:#fff;
      font-size:13px;
      cursor:pointer;
      white-space:nowrap;
    }

    .copy-btn:active {
      transform:translateY(1px);
      background:#2563eb;
    }

    .preview {
      height:40px;
      border-radius:8px;
      border:1px solid #333;
    }

    .status {
      font-size:12px;
      opacity:0.8;
      min-height:16px;
    }
  </style>
</head>
<body>
  <div class="picker-wrapper">
    <div class="picker-header">Hex Color Picker</div>

    <div class="picker-row">
      <label for="colorPicker">Pick color:</label>
      <input id="colorPicker" type="color" value="#ff0000" />
    </div>

    <div class="hex-display-row">
      <span class="hex-label">Hex:</span>
      <input id="hexValue" class="hex-input" type="text" readonly />
      <button id="copyBtn" class="copy-btn" type="button">Copy</button>
    </div>

    <div id="preview" class="preview"></div>
    <div id="status" class="status"></div>
  </div>

  <script>
    const colorInput = document.getElementById('colorPicker');
    const hexInput = document.getElementById('hexValue');
    const preview = document.getElementById('preview');
    const copyBtn = document.getElementById('copyBtn');
    const status = document.getElementById('status');

    function updateFromPicker() {
      const hex = colorInput.value; // already a hex string like "#ff0000" [web:2][web:15]
      hexInput.value = hex;
      preview.style.backgroundColor = hex;
      status.textContent = '';
    }

    async function copyHex() {
      const hex = hexInput.value.trim();
      if (!hex) return;

      try {
        await navigator.clipboard.writeText(hex); [web:13]
        status.textContent = 'Copied ' + hex + ' to clipboard.';
      } catch (err) {
        status.textContent = 'Could not copy. You can copy it manually.';
      }
    }

    // Initialize UI
    updateFromPicker();

    // Live updates as user drags in the picker [web:9][web:1]
    colorInput.addEventListener('input', updateFromPicker);
    copyBtn.addEventListener('click', copyHex);
  </script>
</body>
</html>
